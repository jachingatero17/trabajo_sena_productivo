<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vitaldata · Experiencia 3D</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

    :root {
        --verde: #38c172;
        --verde-claro: #7fe3a3;
        --verde-oscuro: #0c3d22;
        --oscuro: #030b08;
        --panel: rgba(3, 20, 12, 0.94);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Share Tech Mono', monospace; background: var(--oscuro); overflow: hidden; touch-action: none; }

    /* ══════ PANTALLA INTRO ══════ */
    #pantalla-intro {
        position: absolute; inset: 0; z-index: 3000;
        background: radial-gradient(circle at 50% 40%, #0a2b17 0%, var(--oscuro) 70%);
        display: flex; align-items: center; justify-content: center;
    }
    .intro-wrap { text-align: center; color: var(--verde-claro); max-width: 700px; padding: 20px; }
    .intro-logo { width: clamp(240px, 34vw, 380px); margin-bottom: 10px; filter: drop-shadow(0 0 18px rgba(56,193,114,0.7)); animation: flotar 3s ease-in-out infinite; }
    @keyframes flotar { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    .logo-titulo {
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(30px, 6vw, 60px);
        font-weight: 900;
        letter-spacing: 8px;
        color: var(--verde-claro);
        text-shadow: 0 0 20px var(--verde), 0 0 60px var(--verde-oscuro);
        animation: pulso 2s ease-in-out infinite;
        margin: 10px 0 0;
    }
    @keyframes pulso { 0%,100%{text-shadow:0 0 20px var(--verde),0 0 50px var(--verde-oscuro);} 50%{text-shadow:0 0 35px var(--verde-claro),0 0 90px var(--verde), 0 0 130px #fff;} }

    .sub-titulo { font-size: 13px; letter-spacing: 6px; color: #6adf9b; margin: 10px 0 40px; animation: fadeIn 1s ease 0.5s both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

    .btn-iniciar {
        display: block; margin: 0 auto; padding: 16px 60px;
        background: transparent; border: 2px solid var(--verde);
        color: var(--verde-claro);
        font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700;
        letter-spacing: 5px; cursor: pointer; position: relative; overflow: hidden;
        transition: color 0.3s; animation: fadeIn 1s ease 1s both;
    }
    .btn-iniciar::before {
        content: ''; position: absolute; inset: 0;
        background: var(--verde); transform: translateX(-101%);
        transition: transform 0.3s ease; z-index: -1;
    }
    .btn-iniciar:hover { color: #012; }
    .btn-iniciar:hover::before { transform: none; }

    .scan-line {
        position: absolute; top: 0; left: 0; width: 100%; height: 3px;
        background: linear-gradient(90deg, transparent, var(--verde), transparent);
        animation: scan 3s linear infinite;
    }
    @keyframes scan { from{top:0} to{top:100%} }

    /* ══════ UI FLOTANTE EN ESCENA ══════ */
    #ui-escena {
        display: none; position: absolute; inset: 0; z-index: 2500; pointer-events: none;
    }
    #hint-camara {
        position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
        background: var(--panel); border: 1px solid var(--verde); border-radius: 30px;
        padding: 10px 22px; color: var(--verde-claro); font-size: 12px; letter-spacing: 2px;
        pointer-events: none; animation: fadeIn 1s ease 0.5s both;
    }
    #marca-agua {
        position: absolute; top: 18px; left: 22px; display: flex; align-items: center; gap: 10px;
        color: var(--verde-claro); font-family: 'Orbitron', sans-serif; letter-spacing: 3px; font-size: 13px;
        opacity: 0.85;
    }
    #marca-agua img { width: 26px; }

    a-scene { position: absolute; inset: 0; }
</style>
</head>
<body>

    <!-- ══════════════ INTRO ══════════════ -->
    <div id="pantalla-intro">
        <div class="scan-line"></div>
        <div class="intro-wrap">
            <img class="intro-logo" src="logo.png" alt="Vitaldata">
            <h1 class="logo-titulo">VITALDATA</h1>
            <div class="sub-titulo">EXPERIENCIA&nbsp;3D&nbsp;·&nbsp;DATOS&nbsp;QUE&nbsp;LATEN</div>
            <button class="btn-iniciar" id="btn-entrar">ENTRAR</button>
        </div>
    </div>

    <!-- ══════════════ UI EN ESCENA ══════════════ -->
    <div id="ui-escena">
        <div id="marca-agua"><img src="logo.png" alt="">VITALDATA</div>
        <div id="hint-camara">ARRASTRA PARA MIRAR ALREDEDOR · TOCA LA PANTALLA PARA REPRODUCIR</div>
    </div>

        <a-light type="point" color="#38c172" intensity="1.4" position="0 5 4"></a-light>
        <a-light type="point" color="#7fe3a3" intensity="0.8" position="-6 3 -2"></a-light>
        <a-light type="point" color="#7fe3a3" intensity="0.8" position="6 3 -2"></a-light>

        <!-- Piso con grilla de datos -->
        <a-plane id="piso" rotation="-90 0 0" width="60" height="60" position="0 0 0" material="shader: flat; src: #textura-grilla; repeat: 20 20; color: #061c10"></a-plane>

        <!-- ══ PANTALLA CENTRAL CON EL VIDEO ══ -->
        <a-entity position="0 4.4 -8">
            <!-- Marco -->
            <a-box width="10.6" height="6.2" depth="0.3" color="#04140b" material="metalness:0.6; roughness:0.3"></a-box>
            <a-box width="10.9" height="6.5" depth="0.15" position="0 0 -0.1" color="#38c172" material="emissive:#38c172; emissiveIntensity:0.9"></a-box>
            <!-- Video -->
            <a-video id="pantalla-video" src="#video-promo" width="10" height="5.6" position="0 0 0.2"></a-video>
            <!-- Botón play -->
            <a-entity id="boton-play" position="0 0 0.6" class="clickable">
                <a-circle radius="0.8" color="#04140b" opacity="0.75" material="side: double"></a-circle>
                <a-triangle vertices="-0.25 -0.4 0.05, -0.25 0.4 0.05, 0.45 0 0.05" color="#7fe3a3" material="emissive:#7fe3a3; emissiveIntensity:0.8"></a-triangle>
            </a-entity>
        </a-entity>

        <!-- ══ MASCOTA "VITI" EN PRIMER PLANO, SUPERPUESTA A LA PANTALLA (como Dr. Simi frente a la farmacia) ══ -->
        <a-entity id="grupo-mascota" position="-4.4 0 -2.6">
            <!-- sombra de contacto en el piso para anclarla -->
            <a-circle radius="1.6" rotation="-90 0 0" position="0 0.03 0" color="#000000" opacity="0.4" material="transparent: true; side: double; shader: flat"></a-circle>
            <!-- Mascota grande, de pie, delante de la pantalla -->
            <a-image src="#mascota-vitaldata" width="5.4" height="6.5" position="0 3.25 0" transparent="true"
                animation="property: position; to: 0 3.4 0; dir: alternate; dur: 2800; loop: true; easing: easeInOutSine">
            </a-image>
        </a-entity>

        <!-- ══ LOGO DENTRO DE UN CUBO FLOTANTE (izquierda) ══ -->
        <a-entity id="cubo-logo" position="-7.6 4.8 -6.5"
            animation="property: position; to: -7.6 5.3 -6.5; dir: alternate; dur: 2600; loop: true; easing: easeInOutSine"
            animation__rot="property: rotation; to: 0 360 0; dur: 14000; loop: true; easing: linear">
            <!-- caras de vidrio del cubo -->
            <a-box width="3.8" height="3.8" depth="3.8" color="#04140b" opacity="0.28" transparent="true" material="metalness:0.7; roughness:0.2; side: double"></a-box>
            <!-- aristas brillantes -->
            <a-box width="3.83" height="3.83" depth="3.83" wireframe="true" color="#38c172" material="wireframeLinewidth:2"></a-box>
            <!-- logo dentro (mas grande) -->
            <a-image src="#logo-vitaldata" width="3.05" height="2.53" position="0 0 0" transparent="true"></a-image>
            <a-image src="#logo-vitaldata" width="3.05" height="2.53" position="0 0 -0.02" rotation="0 180 0" transparent="true"></a-image>
        </a-entity>

        <!-- ══ LÍNEA DE PULSO (ECG) frente a la pantalla ══ -->
        <a-entity id="linea-pulso" position="0 0.05 -3" pulso-ecg></a-entity>

        <!-- ══ PARTÍCULAS DE DATOS FLOTANTES ══ -->
        <a-entity id="particulas" particulas-datos="cantidad: 45"></a-entity>

        <!-- Columnas decorativas tipo centro de datos -->
        <a-box position="-10 2 -8" width="0.6" height="4" depth="0.6" color="#04140b" material="emissive:#38c172; emissiveIntensity:0.25"></a-box>
        <a-box position="10 2 -8" width="0.6" height="4" depth="0.6" color="#04140b" material="emissive:#38c172; emissiveIntensity:0.25"></a-box>
        <a-box position="-10 2 2" width="0.6" height="4" depth="0.6" color="#04140b" material="emissive:#38c172; emissiveIntensity:0.25"></a-box>
        <a-box position="10 2 2" width="0.6" height="4" depth="0.6" color="#04140b" material="emissive:#38c172; emissiveIntensity:0.25"></a-box>

        <!-- ══ CÁMARA: sin desplazamiento, mirar libre ══ -->
        <a-entity id="rig-camara" position="0 4.4 4">
            <a-camera look-controls="reverseMouseDrag: false" wasd-controls="enabled: false">
                <!-- cursor de mouse, para computador/celular -->
                <a-entity cursor="rayOrigin: mouse; fuse: false"
                    raycaster="objects: #boton-play, #boton-play *, #pantalla-video; far: 30">
                </a-entity>
                <!-- mira central para gafas VR sin mando: con mirar 1.2s el boton, se activa -->
                <a-entity cursor="fuse: true; fuseTimeout: 1200"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.006; radiusOuter: 0.012; segmentsTheta: 32"
                    material="color: #7fe3a3; shader: flat; opacity: 0.9; side: double"
                    raycaster="objects: #boton-play, #boton-play *, #pantalla-video; far: 30">
                </a-entity>
            </a-camera>
            <!-- mandos físicos (Quest, Index, Vive, etc.): apuntar y apretar el gatillo activa el video -->
            <a-entity laser-controls="hand: left" raycaster="objects: #boton-play, #boton-play *, #pantalla-video; far: 30"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: #boton-play, #boton-play *, #pantalla-video; far: 30"></a-entity>
        </a-entity>

    </a-scene>

<script>
    /* ══ Componente: grilla generada por canvas para el piso ══ */
    (function crearTexturaGrilla() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#061c10'; ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = 'rgba(56,193,114,0.55)'; ctx.lineWidth = 2;
        for (let i = 0; i <= 512; i += 64) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
        }
        canvas.id = 'canvas-grilla';
        const img = document.createElement('img');
        img.id = 'textura-grilla';
        img.src = canvas.toDataURL();
        document.querySelector('a-assets').appendChild(img);
    })();

    /* ══ Componente: partículas de datos flotando ══ */
    AFRAME.registerComponent('particulas-datos', {
        schema: { cantidad: { type: 'number', default: 40 } },
        init: function () {
            const colores = ['#38c172', '#7fe3a3', '#ffffff'];
            for (let i = 0; i < this.data.cantidad; i++) {
                const p = document.createElement('a-entity');
                const x = (Math.random() - 0.5) * 22;
                const y = 0.5 + Math.random() * 7;
                const z = -1 - Math.random() * 14;
                const s = 0.05 + Math.random() * 0.09;
                const dur = 2500 + Math.random() * 3000;
                const color = colores[Math.floor(Math.random() * colores.length)];
                p.setAttribute('geometry', `primitive: box; width:${s}; height:${s}; depth:${s}`);
                p.setAttribute('material', `color:${color}; emissive:${color}; emissiveIntensity:0.9`);
                p.setAttribute('position', `${x} ${y} ${z}`);
                p.setAttribute('animation', `property: position; to: ${x} ${y + 0.6} ${z}; dir: alternate; dur: ${dur}; loop: true; easing: easeInOutSine`);
                p.setAttribute('animation__rot', `property: rotation; to: 360 360 0; dur: ${dur * 2}; loop: true; easing: linear`);
                this.el.appendChild(p);
            }
        }
    });

    /* ══ Componente: línea de pulso tipo ECG animada ══ */
    AFRAME.registerComponent('pulso-ecg', {
        init: function () {
            const puntos = [
                [-6, 0], [-5, 0], [-4.3, 0], [-4, 1.4], [-3.7, -1.2], [-3.3, 0], [-2.6, 0],
                [-1.8, 0], [-1.5, 1.4], [-1.2, -1.2], [-0.8, 0], [0, 0],
                [0.8, 0], [1.2, -1.2], [1.5, 1.4], [1.8, 0], [2.6, 0],
                [3.3, 0], [3.7, -1.2], [4, 1.4], [4.3, 0], [5, 0], [6, 0]
            ];
            let segStr = 'M ' + puntos.map(p => p[0] + ',' + p[1]).join(' L ');
            for (let i = 0; i < puntos.length - 1; i++) {
                const a = puntos[i], b = puntos[i + 1];
                const seg = document.createElement('a-entity');
                seg.setAttribute('line', `start: ${a[0]} ${a[1] * 0.3} 0; end: ${b[0]} ${b[1] * 0.3} 0; color: #38c172`);
                seg.setAttribute('animation__pulso', `property: line.color; type: color; from: #0c3d22; to: #7fe3a3; dir: alternate; dur: 900; loop: true; delay: ${i * 60}`);
                this.el.appendChild(seg);
            }
        }
    });

    /* ══ Control de intro y video ══ */
    const btnEntrar = document.getElementById('btn-entrar');
    const pantallaIntro = document.getElementById('pantalla-intro');
    const uiEscena = document.getElementById('ui-escena');
    const video = document.getElementById('video-promo');
    const botonPlay = document.getElementById('boton-play');

    btnEntrar.addEventListener('click', () => {
        pantallaIntro.style.display = 'none';
        uiEscena.style.display = 'block';
    });

    function alternarVideo() {
        if (video.paused) { video.play(); botonPlay.setAttribute('visible', 'false'); }
        else { video.pause(); botonPlay.setAttribute('visible', 'true'); }
    }
    botonPlay.addEventListener('click', alternarVideo);
    document.getElementById('pantalla-video').addEventListener('click', alternarVideo);
    video.addEventListener('ended', () => botonPlay.setAttribute('visible', 'true'));
</script>
</body>
</html>
